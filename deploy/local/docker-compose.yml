name: iceberg-exporter

services:
  minio:
    # Official MinIO images are no longer public. Silo is the MinIO-compatible fork.
    image: pgsty/silo:latest@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: pgsty/silo:latest@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/warehouse

  nessie:
    image: ghcr.io/projectnessie/nessie:0.106.2
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "19120:19120"
    environment:
      - nessie.version.store.type=IN_MEMORY
      - nessie.server.authentication.enabled=false
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.auth-type=STATIC
      - nessie.catalog.service.s3.default-options.request-signing-enabled=false
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:my-secrets.s3-default
      - my-secrets.s3-default.name=minioadmin
      - my-secrets.s3-default.secret=minioadmin
    healthcheck:
      test: "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /q/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  generator:
    build:
      context: ./generator
    depends_on:
      nessie:
        condition: service_healthy
    environment:
      NESSIE_BASE_URL: http://nessie:19120
      NESSIE_ICEBERG_URI: http://nessie:19120/iceberg
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      INTERVAL_SECONDS: "20"
      DURATION_SECONDS: "300"
    restart: on-failure

  exporter:
    build:
      context: ../..
      dockerfile: deploy/local/exporter.Dockerfile
    depends_on:
      nessie:
        condition: service_healthy
    environment:
      CATALOG_NAME: local
      NESSIE_URL: http://nessie:19120
      REFS: main,dev
      BASE_REF: main
      LISTEN: ":8080"
      INTERVAL: 15s
      MANIFEST_REFRESH: 1m
      DELETE_MANIFESTS: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    depends_on:
      exporter:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/iceberg.rules.yaml:/etc/prometheus/iceberg.rules.yaml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
